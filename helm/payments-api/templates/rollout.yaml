# Rendered as an Argo Rollouts "Rollout" resource instead of a plain
# apps/v1 Deployment. Rollout is a drop-in superset of Deployment's spec
# (same selector/template fields) plus a `strategy` block that Argo
# Rollouts' controller uses to drive progressive delivery. This uses
# "basic canary" (replica-weighted, no service mesh/traffic-router plugin
# required) -- the single Service below selects on the same pod labels
# used by both the canary and stable ReplicaSets, so traffic is
# approximated by how many pods of each currently exist.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "service.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "service.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "service.fullname" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- else }}
          env: []
          {{- end }}
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
        # No further explicit step -- once the pause elapses, Argo
        # Rollouts automatically promotes to 100% stable since there are
        # no remaining steps. This keeps rollouts fully automated for
        # healthy deployments; the Observability Agent (Milestone 5) is
        # what watches this process and flags it if it doesn't reach
        # steady state.
