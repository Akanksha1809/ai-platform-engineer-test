replicaCount: 3

image:
  repository: myorg/orders-api
  tag: "1.4.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 250m
    memory: 512Mi

env:
  DB_HOST: "postgres-db"
  DB_USER: "orders_user"
  DB_PASSWORD: "secure_password"
  S3_BUCKET_NAME: "orders-bucket"

namespace: default
